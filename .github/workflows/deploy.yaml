name: Multi-Stage Homelab Deployment

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  deploy-dev:
    if: github.ref_name == 'dev'
    runs-on: [self-hosted, dev]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create dev config
        env:
          APP_CONFIG: ${{ secrets.DEV_APP_CONFIG }}
        run: |
          test -n "$APP_CONFIG"
          printf '%s' "$APP_CONFIG" > config/config.json
          chmod 600 config/config.json

      - name: Deploy dev with Docker
        env:
          SECRET_NC_USER: ${{ secrets.DEV_NEXTCLOUD_USER }}
          SECRET_NC_PASS: ${{ secrets.DEV_NEXTCLOUD_PASSWORD }}
          SECRET_PL_TOKEN: ${{ secrets.DEV_PAPERLESS_TOKEN }}
          SECRET_NC_BASE_URL: ${{ secrets.ONELAB_NEXTCLOUD_BASE_URL }}
          SECRET_PL_BASE_URL: ${{ secrets.ONELAB_PAPERLESS_BASE_URL }}
          SECRET_JWT: ${{ secrets.DEV_JWT_SECRET }}
          SECRET_CLIENT_ID: ${{ secrets.DEV_AUTH_CLIENT_ID }}
          SECRET_CLIENT_SECRET: ${{ secrets.DEV_AUTH_CLIENT_SECRET }}
        run: |
          docker stop onelab-api-dev || true
          docker rm onelab-api-dev || true
          docker build -t onelab-api:dev .
          docker run -d \
            --name onelab-api-dev \
            --restart always \
            --label com.docker.compose.project=onelab-api \
            --label com.docker.compose.service=dev \
            -p 8090:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /etc/ssl/certs:/etc/ssl/certs:ro \
            -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -e SSL_CERT_DIR=/etc/ssl/certs \
            -e ONELAB_NEXTCLOUD_USER="$SECRET_NC_USER" \
            -e ONELAB_NEXTCLOUD_PASSWORD="$SECRET_NC_PASS" \
            -e ONELAB_PAPERLESS_TOKEN="$SECRET_PL_TOKEN" \
            -e ONELAB_NEXTCLOUD_BASE_URL="$SECRET_NC_BASE_URL" \
            -e ONELAB_PAPERLESS_BASE_URL="$SECRET_PL_BASE_URL" \
            -e ONELAB_JWT_SECRET="$SECRET_JWT" \
            -e ONELAB_AUTH_CLIENT_ID="$SECRET_CLIENT_ID" \
            -e ONELAB_AUTH_CLIENT_SECRET="$SECRET_CLIENT_SECRET" \
            onelab-api:dev

      - name: Remove dev config
        if: always()
        run: |
          rm -f config/config.json

      - name: Cleanup
        run: docker image prune -f

  gatecheck-prod:
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Await Manual Approval
        uses: trstringer/manual-approval@v1
        with:
          secret: ${{ github.TOKEN }}
          approvers: HTMLuke
          minimum-approvals: 1
          issue-title: "Deploy OneLab-API to Production"
          issue-body: "Please reply with 'approve' or 'deny' to control the Homelab VM deployment."

  deploy-prod:
    needs: gatecheck-prod
    runs-on: [self-hosted, prod]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create prod config
        env:
          APP_CONFIG: ${{ secrets.PROD_APP_CONFIG }}
        run: |
          test -n "$APP_CONFIG"
          printf '%s' "$APP_CONFIG" > config/config.json
          chmod 600 config/config.json

      - name: Deploy prod with Docker
        env:
          SECRET_NC_USER: ${{ secrets.PROD_NEXTCLOUD_USER }}
          SECRET_NC_PASS: ${{ secrets.PROD_NEXTCLOUD_PASSWORD }}
          SECRET_PL_TOKEN: ${{ secrets.PROD_PAPERLESS_TOKEN }}
          SECRET_NC_BASE_URL: ${{ secrets.ONELAB_NEXTCLOUD_BASE_URL }}
          SECRET_PL_BASE_URL: ${{ secrets.ONELAB_PAPERLESS_BASE_URL }}
          SECRET_JWT: ${{ secrets.PROD_JWT_SECRET }}
          SECRET_CLIENT_ID: ${{ secrets.PROD_AUTH_CLIENT_ID }}
          SECRET_CLIENT_SECRET: ${{ secrets.PROD_AUTH_CLIENT_SECRET }}
        run: |
          docker stop onelab-api-prod || true
          docker rm onelab-api-prod || true
          docker build -t onelab-api:prod .
          docker run -d \
            --name onelab-api-prod \
            --restart always \
            --label com.docker.compose.project=onelab-api \
            --label com.docker.compose.service=prod \
            -p 8080:8080 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /etc/ssl/certs:/etc/ssl/certs:ro \
            -e SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt \
            -e SSL_CERT_DIR=/etc/ssl/certs \
            -e ONELAB_NEXTCLOUD_USER="$SECRET_NC_USER" \
            -e ONELAB_NEXTCLOUD_PASSWORD="$SECRET_NC_PASS" \
            -e ONELAB_PAPERLESS_TOKEN="$SECRET_PL_TOKEN" \
            -e ONELAB_NEXTCLOUD_BASE_URL="$SECRET_NC_BASE_URL" \
            -e ONELAB_PAPERLESS_BASE_URL="$SECRET_PL_BASE_URL" \
            -e ONELAB_JWT_SECRET="$SECRET_JWT" \
            -e ONELAB_AUTH_CLIENT_ID="$SECRET_CLIENT_ID" \
            -e ONELAB_AUTH_CLIENT_SECRET="$SECRET_CLIENT_SECRET" \
            onelab-api:prod

      - name: Remove prod config
        if: always()
        run: |
          rm -f config/config.json

      - name: Cleanup
        run: docker image prune -f
